  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      java-version: '17'
      distribution: temurin

  - name: Grant execute permission for gradlew (if present)
    run: |
      if [ -f gradlew ]; then chmod +x gradlew; fi

  - name: Build debug APK
    run: |
      if [ -f ./gradlew ]; then ./gradlew assembleDebug --no-daemon; else echo 'gradlew not found; CI requires gradle wrapper'; exit 0; fi

  - name: Upload APK artifact
    uses: actions/upload-artifact@v4
    with:
      name: app-debug-apk
      path: app/build/outputs/apk/debug/*.apk

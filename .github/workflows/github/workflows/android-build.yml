name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
  GRADLE_USER_HOME: ${{ runner.temp }}/gradle-cache

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Install tools (wget, unzip)
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip

      - name: Install Android command-line tools and SDK packages
        run: |
          mkdir -p "${ANDROID_SDK_ROOT}"
          cd "${ANDROID_SDK_ROOT}"
          # Download CLI tools (version may change; this link should work)
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d cmdline-tools-temp
          mkdir -p cmdline-tools/latest
          mv cmdline-tools-temp/cmdline-tools/* cmdline-tools/latest/
          rm -rf cmdline-tools.zip cmdline-tools-temp
          export PATH="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin:${ANDROID_SDK_ROOT}/platform-tools:$PATH"
          yes | sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --licenses
          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" "platform-tools" "platforms;android-33" "build-tools;33.0.2"
        shell: bash

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.GRADLE_USER_HOME }}
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-cache-${{ runner.os }}-${{ hashFiles('**/gradle-wrapper.properties', '**/*.gradle*') }}
          restore-keys: gradle-cache-${{ runner.os }}-

      - name: Grant execute permission for gradlew (if present)
        run: |
          if [ -f gradlew ]; then chmod +x gradlew; fi

      - name: Download Gradle (if no wrapper)
        if: "!exists('gradlew')"
        run: |
          GRADLE_VERSION=7.5.1
          wget -q https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip -O gradle.zip
          unzip -q gradle.zip -d /tmp
          mv /tmp/gradle-${GRADLE_VERSION} gradle
          rm gradle.zip
        shell: bash

      - name: Build debug APK
        run: |
          # Ensure Android SDK tools are available in PATH
          export PATH="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin:${ANDROID_SDK_ROOT}/platform-tools:${PWD}/gradle/bin:$PATH"
          if [ -f ./gradlew ]; then
            ./gradlew assembleDebug --no-daemon
          else
            ./gradle/bin/gradle assembleDebug --no-daemon
          fi
        shell: bash

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/**/*debug*.apk
